settings:
  cache_path: ".zeno_cache_1108"
  host: localhost
  port: 8015

data:
  data_path: "data/synthetic_travel.csv"
  sample_size: 30
  data_column: "input"

models:
  - "gpt-4o-mini"

prompt:
  task_description: "Create travel plan sketches based on user-provided constraints and preferences."
  requirements:
    - name: "budget"
      description: "Make sure the budget constraint is considered when creating travel plan."
      priority: "hard"
      category: "content"
      feature: "economic-consideration"
