settings:
  cache_path: ".zeno_cache_1112"
  host: localhost
  port: 8015

data:
  data_path: "data/synthetic_travel.csv"
  sample_size: 30
  data_column: "input"

models:
  - "gpt-4o-mini-2024-07-18"

prompt:
  task_description: "Create travel plan sketches based on user-provided constraints and preferences."
  requirements:
    - name: "budget"
      description: "Make sure the budget constraint is considered when creating travel plan."
      priority: "hard"
      category: "content"
      feature: "economic-consideration"
    - name: "time-optimization"
      description: "Ensure the travel plan is optimized to minimize transit time, allowing more time at destinations based on user preferences."
      priority: "hard"
      category: "content"
      feature: "time-management"
    - name: "activity-recommendations"
      description: "Suggest activities or points of interest that align with user interests (e.g., cultural, adventure, relaxation) for each destination in the travel plan."
      priority: "soft"
      category: "content"
      feature: "personalization"
